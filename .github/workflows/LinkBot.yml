name: PR URL and file-type checks

# pull_request_target runs this workflow (and the script it calls) as they exist
# on the base branch, with a token that can comment on PRs from forks. This is
# only safe because nothing from the PR is ever executed: its commits are
# fetched and read as git data.
# Do NOT check out the PR head into the workspace or run scripts from it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      result: ${{ steps.check.outputs.result }}
      report: ${{ steps.check.outputs.report }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR commits (read as data only)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Check file types, YAML and URLs
        id: check
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/link_check.md"
          python .github/scripts/link_check.py "$BASE_SHA" "$HEAD_SHA" "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "report<<$delim"
            cat "$REPORT"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  # Separate job so the write token is never present while PR content is handled.
  comment:
    needs: validate-pr
    if: always() && needs.validate-pr.outputs.report != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment report on PR
        uses: actions/github-script@v7
        env:
          REPORT: ${{ needs.validate-pr.outputs.report }}
        with:
          script: |
            const marker = '<!-- linkbot-report -->';
            const body = process.env.REPORT;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail workflow when checks fail
        if: always()
        shell: bash
        env:
          RESULT: ${{ needs.validate-pr.outputs.result }}
        run: |
          if [[ "$RESULT" != "pass" ]]; then
            echo "LinkBot checks did not pass (result: ${RESULT:-none}). See the PR comment or job summary."
            exit 1
          fi
